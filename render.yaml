# Free portfolio demo: uploaded documents and edits reset on restart.
services:
  - type: web
    name: docuintel-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: VITE_TEMPORARY_DEMO
        value: "true"
